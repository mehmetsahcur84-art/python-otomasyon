<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Mehmet & Murat</title>
    <style>
        body {
            background-color: #050505;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .particle {
            position: absolute;
            color: #ff5e7e;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 0 10px #ff5e7e, 0 0 20px #ff5e7e;
            animation: floatUp linear infinite;
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.5);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translateY(-50px) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<script>
    const ozelMetin = "Mehmet💞 ∞ Murat💞";

    function createParticle() {
        const p = document.createElement('div');
        p.classList.add('particle');
        p.innerText = ozelMetin;
        
        p.style.left = Math.random() * window.innerWidth + 'px';
        p.style.animationDuration = (Math.random() * 4 + 3) + 's';
        p.style.fontSize = (Math.random() * 15 + 16) + 'px';
        
        const colors = ['#ff5e7e', '#ff007f', '#ffcc00', '#ffffff'];
        p.style.color = colors[Math.floor(Math.random() * colors.length)];
        p.style.textShadow = `0 0 12px ${p.style.color}`;

        document.body.appendChild(p);

        setTimeout(() => {
            p.remove();
        }, 7000);
    }

    setInterval(createParticle, 150);
</script>

</body>
</html>
